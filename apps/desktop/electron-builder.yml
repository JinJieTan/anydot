appId: dev.aitech.desktop
productName: AnyDot
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Where electron-updater looks for new versions (written into the app as app-update.yml).
# CI uploads the files itself, so electron-builder never publishes.
publish:
  provider: github
  owner: JinJieTan
  repo: anydot
mac:
  category: public.app-category.developer-tools
  # Names the zips; the dmg section names the dmgs.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    # The updater reads latest-mac.yml, which electron-builder only writes for zip builds.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  # No arch list here: CI passes --x64 / --arm64 so each installer is built on its own
  # (an arch list in the config overrides the CLI flags and adds a combined installer).
  target: nsis
nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
