name: Release

# Push a tag like v0.1.0 to build unsigned installers and attach them to a
# draft GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Use the tag as the app version
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build
        run: pnpm --filter @aitech/desktop build

      # No certificates: macOS builds get an ad-hoc signature (valid, but not
      # from an identified developer), so users open them once via System Settings.
      - name: Package (macOS, arm64 + x64)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac -c.mac.identity=- -c.mac.hardenedRuntime=false --publish never

      # One installer per architecture, rather than a combined one twice the size.
      # Each gets its own update channel so the arm64 build doesn't overwrite latest.yml.
      - name: Package (Windows, x64 and arm64)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 -c.publish.channel=latest-arm64 --publish never

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body_path: .github/release-notes.md
          # The .yml and .blockmap files are for the in-app updater; the zips are what macOS updates from.
          files: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*-mac-*.zip
            apps/desktop/release/*/*-setup.exe
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest*.yml
